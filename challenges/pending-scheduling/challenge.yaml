apiVersion: kubedrill.dev/v1alpha1
kind: Challenge
metadata:
  name: pending-scheduling
  version: "1.0.0"
  title: "Pods stuck Pending"
  description: |
    The `worker` deployment in namespace `batch` is stuck — its pods won't
    schedule onto any node. Find out why and get it to 2 available replicas.
  difficulty: easy
  topics: [scheduling, troubleshooting]
  exam: [cka]
  timeLimit: 10m
environment:
  cluster:
    kubernetesVersion: "1.31"
  images: [nginx:1.27-alpine]
  setup:
    manifests:
      - path: setup/01-worker.yaml
    faults:
      - name: impossible-nodeselector
        patch:
          target: { kind: Deployment, name: worker, namespace: batch, apiVersion: apps/v1 }
          type: merge
          data:
            spec:
              template:
                spec:
                  nodeSelector:
                    kubedrill.io/pool: gpu
    readiness:
      - cel: "!has(object.status.availableReplicas) || object.status.availableReplicas < 2"
        target: { kind: Deployment, name: worker, namespace: batch, apiVersion: apps/v1 }
        poll: { timeout: 60s }
objectives:
  - id: worker-available
    title: "worker has 2 available replicas"
    points: 100
    checks:
      - match:
          target: { kind: Deployment, name: worker, namespace: batch, apiVersion: apps/v1 }
          object:
            status:
              availableReplicas: 2
hints:
  - { id: h1, penalty: 10, text: "kubectl -n batch describe pod — read the FailedScheduling event." }
  - { id: h2, penalty: 20, text: "A nodeSelector requires a label no node has. Remove it (or label a node)." }
solution:
  explanation: solution/SOLUTION.md
  script: solution/solve.sh
