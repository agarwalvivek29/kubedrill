apiVersion: v1
kind: Namespace
metadata:
  name: warehouse
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bulk
  namespace: warehouse
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loader
  namespace: warehouse
  labels: { app: loader }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loader }
  template:
    metadata:
      labels: { app: loader }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bulk
