apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder
  namespace: pipeline
  labels: { app: builder }
spec:
  replicas: 2
  selector:
    matchLabels: { app: builder }
  template:
    metadata:
      labels: { app: builder }
    spec:
      initContainers:
        - name: prepare
          image: busybox:1.36
          command: ["sh", "-c", "echo prepared"]
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
